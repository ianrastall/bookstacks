name: Deploy to GitHub Pages

on:
  # Build and deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Allow this job to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only the latest Pages deployment to proceed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24

      - name: Verify build output
        run: ls -la dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
